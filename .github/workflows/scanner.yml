name: Run Micro-Cap Catalyst Scanner

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours automatically
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas

      - name: Run Background Scanner Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python -c "
          import os, requests
          webhook_url = os.getenv('DISCORD_WEBHOOK')
          data = {'content': '<@539685617966120990> 🔍 Scheduled background scan ran successfully! No new anomalies found.'}
          requests.post(webhook_url, json=data)
          "
